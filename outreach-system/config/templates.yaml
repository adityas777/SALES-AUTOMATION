# Category -> approved WhatsApp template + email template.
#
# IMPORTANT: `whatsapp.template_name` must match, character-for-character, a
# template already APPROVED in Meta Business Manager. Creating a block here
# does NOT create the WhatsApp template - submit it in Meta first, then wire
# the name here. Until approved, leave use_whatsapp: false for that category
# and outreach falls back to email-only.
#
# `email.body_template_path` points at an HTML file under templates/email/.
# Personalization (groq_personalizer.py) fills {{business_name}}, {{category}},
# {{city}} placeholders at send time.

dance:
  use_whatsapp: false
  whatsapp:
    template_name: "dance_academy_intro_v1"
    language: "en"
  email:
    subject: "Grow {{business_name}}'s enrollments with a free 15-min demo"
    body_template_path: "templates/email/dance.html"


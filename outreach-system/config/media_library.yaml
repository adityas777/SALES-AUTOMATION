# Category -> approved outreach asset. Drop the actual file at this path
# under content_library/ and it's picked up automatically - no code change.
#
# type: image | video | reel
# For WhatsApp media-header templates, the file must ALSO be uploaded once via
# Meta's Resumable Upload API to get a media handle referenced by the approved
# template (see senders/whatsapp_sender.py) - this YAML just tells the system
# which local file corresponds to which category for that upload step and for
# email attachments/links.

dance:
  type: image
  path: "content_library/images/dance/intro.jpg"
yoga:
  type: image
  path: "content_library/images/yoga/intro.jpg"
gym_fitness:
